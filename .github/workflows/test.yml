name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: End-to-end (サンプルRSS + テンプレート台本 + 無音TTS)
        run: |
          python -m radio.pipeline --site site --sample --topics tests/fixtures/topics_sample.json --llm template --tts silent --now 2026-11-08T05:00:00+09:00
          python -m tools.check_site site
