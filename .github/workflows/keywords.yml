name: keywords

# 「キーワードを変える」Issue フォームから config/topics.json を更新する
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    # 公開リポジトリなので、リポジトリの持ち主が立てた Issue だけ反映する
    if: contains(github.event.issue.labels.*.name, 'keywords') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply
        id: apply
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$BODY" > body.md
          set +e
          python -m tools.apply_keyword_issue body.md > result.txt
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat result.txt
      - name: Commit
        if: steps.apply.outputs.code == '0'
        run: |
          git config user.name "popradi-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/topics.json
          git commit -m "keywords: issue #${{ github.event.issue.number }}" && git push
      - name: Reply and close
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body-file result.txt
          gh issue close ${{ github.event.issue.number }}
